name: PeleAnalysis-CI

on:
   workflow_dispatch:
   push:
     branches: [development]
   pull_request:
     branches: [development]

concurrency:
  group: ${{github.ref}}-${{github.head_ref}}-ci
  cancel-in-progress: true

# Tools known not to compile for a given configuration, as space-separated
# tool names. .github/scripts/build_tools.sh skips the union of every list
# that applies to a build:
#   EXPECTED_<DIM>D_FAILURES      tools that only support the other dimension
#   EXPECTED_<BACKEND>_FAILURES   tools that do not compile for a GPU backend
env:
  EXPECTED_2D_FAILURES: 'qCriterion sequentialFilterPlt'
  EXPECTED_3D_FAILURES: ''
  EXPECTED_CUDA_FAILURES: 'amrToFE ciao2plt conditionalMean jpdf makePlotfile partStream stream2plt streamBinTubeStats trimMEFgen turbfile plotQPD'
  EXPECTED_HIP_FAILURES: 'amrToFE ciao2plt conditionalMean jpdf makePlotfile partStream stream2plt streamBinTubeStats trimMEFgen turbfile plotQPD'
  EXPECTED_SYCL_FAILURES: 'amrToFE ciao2plt conditionalMean jpdf makePlotfile partStream stream2plt streamBinTubeStats trimMEFgen turbfile plotQPD'

jobs:

# This is mostly just copied from the PelePhysics CI
# and pruned somewhat. Stuff to add back indicated
# with TODOs
