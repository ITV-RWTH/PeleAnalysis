  Formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Clone
        uses: actions/checkout@v4
      - name: Check formatting
        uses: DoozyX/clang-format-lint-action@v0.18.1
        with:
          source: './Src'
          exclude: '.'
          extensions: 'H,h,cpp'
          clangFormatVersion: 18
