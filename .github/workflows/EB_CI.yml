name: EB-Tools

on:
  workflow_dispatch:
  push:
    branches: [ dev_Marwin] #, development
  pull_request:
     branches: [development]  

jobs:
  # Formatting:
  #     runs-on: ubuntu-latest
  #     steps:
  #     - name: Clone
  #       uses: actions/checkout@v4
  #     - name: Check formatting
  #       uses: DoozyX/clang-format-lint-action@v0.18.2
